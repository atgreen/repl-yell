<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace">
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
    <marker id="agr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a4"/>
    </marker>
  </defs>

  <rect width="760" height="660" rx="8" fill="#111"/>

  <text x="380" y="34" text-anchor="middle" fill="#e6e6e6" font-size="16" font-weight="bold">From signature to a move program, then run</text>

  <!-- phase labels -->
  <text x="724" y="120" text-anchor="end" fill="#ff6b6b" font-size="11">ffi_call_plan_alloc (once)</text>
  <text x="724" y="348" text-anchor="end" fill="#4a4" font-size="11">ffi_call_plan_invoke (every call)</text>

  <!-- signature -->
  <rect x="230" y="56" width="300" height="50" rx="6" fill="#1a1a1a" stroke="#ff3333" stroke-width="2"/>
  <text x="380" y="77" text-anchor="middle" fill="#888" font-size="11">ffi_cif: the signature</text>
  <text x="380" y="96" text-anchor="middle" fill="#e6e6e6" font-size="13">long (void *, int, void *)</text>

  <line x1="380" y1="106" x2="380" y2="134" stroke="#999" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="392" y="125" fill="#888" font-size="11">build_plan(): classify each arg once</text>

  <!-- the move program (the VM) -->
  <rect x="150" y="136" width="460" height="166" rx="6" fill="#191510" stroke="#e3b341" stroke-width="2"/>
  <text x="170" y="160" fill="#e3b341" font-size="13" font-weight="bold">plan: a little move program</text>
  <text x="170" y="186" fill="#e6e6e6" font-size="12.5">GP64   avalue[0]              &#8594; gpr[0]  (rdi)</text>
  <text x="170" y="208" fill="#e6e6e6" font-size="12.5">SE32   avalue[1]  sign-extend &#8594; gpr[1]  (rsi)</text>
  <text x="170" y="230" fill="#e6e6e6" font-size="12.5">GP64   avalue[2]              &#8594; gpr[2]  (rdx)</text>
  <text x="170" y="252" fill="#888"    font-size="12.5">rax    = ssecount (= 0)</text>
  <line x1="166" y1="266" x2="594" y2="266" stroke="#333" stroke-width="1"/>
  <text x="170" y="286" fill="#888" font-size="11">caller-owned, immutable, shareable across threads</text>

  <line x1="380" y1="302" x2="380" y2="356" stroke="#999" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="392" y="335" fill="#888" font-size="11">invoke: run the plan</text>

  <!-- decision -->
  <polygon points="380,358 506,400 380,442 254,400" fill="#1a1a1a" stroke="#666" stroke-width="1.5"/>
  <text x="380" y="396" text-anchor="middle" fill="#e6e6e6" font-size="12">thunk-eligible?</text>
  <text x="380" y="412" text-anchor="middle" fill="#888" font-size="10.5">all GP64, no stack, simple ret</text>

  <!-- yes / fast lane -->
  <line x1="254" y1="400" x2="200" y2="468" stroke="#4a4" stroke-width="2" marker-end="url(#agr)"/>
  <text x="150" y="436" fill="#4a4" font-size="11">yes</text>
  <text x="150" y="452" fill="#888" font-size="10.5">~90% of real calls</text>
  <rect x="44" y="470" width="300" height="96" rx="6" fill="#13201a" stroke="#4a4" stroke-width="2"/>
  <text x="60" y="494" fill="#4a4" font-size="12.5" font-weight="bold">GP64 thunk: ffi_gp_thunks[n]</text>
  <text x="60" y="518" fill="#e6e6e6" font-size="11.5">load avalue[0..n] straight into</text>
  <text x="60" y="536" fill="#e6e6e6" font-size="11.5">the argument registers, then call.</text>
  <text x="60" y="556" fill="#888" font-size="11.5">no register image, no move loop</text>

  <!-- no / interpret lane -->
  <line x1="506" y1="400" x2="560" y2="468" stroke="#999" stroke-width="2" marker-end="url(#ag)"/>
  <text x="514" y="436" fill="#bbb" font-size="11">no</text>
  <text x="514" y="452" fill="#888" font-size="10.5">SE32 here</text>
  <rect x="416" y="470" width="300" height="96" rx="6" fill="#1a1a1a" stroke="#777" stroke-width="2"/>
  <text x="432" y="494" fill="#e6e6e6" font-size="12.5" font-weight="bold">interpret the moves</text>
  <text x="432" y="518" fill="#e6e6e6" font-size="11.5">run each move &#8594; fill the</text>
  <text x="432" y="536" fill="#e6e6e6" font-size="11.5">register_args image, then</text>
  <text x="432" y="556" fill="#888" font-size="11.5">hand off to ffi_call_unix64</text>

  <!-- converge -->
  <line x1="194" y1="566" x2="350" y2="606" stroke="#999" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="566" y1="566" x2="410" y2="606" stroke="#999" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="290" y="608" width="180" height="40" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
  <text x="380" y="633" text-anchor="middle" fill="#e6e6e6" font-size="13">native call &#8594; fn()</text>
</svg>
