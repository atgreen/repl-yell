<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
    <marker id="arrow3r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff3333"/>
    </marker>
  </defs>

  <rect width="720" height="360" rx="8" fill="#111"/>

  <text x="360" y="36" text-anchor="middle" fill="#e6e6e6" font-size="16" font-weight="bold">Cache Invalidation: update-dfun Override</text>

  <!-- Trigger -->
  <rect x="40" y="64" width="200" height="44" rx="6" fill="#1a1a1a" stroke="#ff3333" stroke-width="2"/>
  <text x="140" y="84" text-anchor="middle" fill="#ff3333" font-size="12">new class/method</text>
  <text x="140" y="100" text-anchor="middle" fill="#ff3333" font-size="12">defined</text>

  <line x1="240" y1="86" x2="290" y2="86" stroke="#999" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- PCL calls update-dfun -->
  <rect x="290" y="64" width="200" height="44" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
  <text x="390" y="91" text-anchor="middle" fill="#e6e6e6" font-size="13">PCL calls update-dfun</text>

  <!-- Branch: is it a java-generic-function? -->
  <line x1="490" y1="86" x2="540" y2="86" stroke="#999" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <rect x="540" y="56" width="150" height="60" rx="6" fill="#1a1a1a" stroke="#ff3333" stroke-width="1.5"/>
  <text x="615" y="82" text-anchor="middle" fill="#e6e6e6" font-size="11">java-generic-</text>
  <text x="615" y="98" text-anchor="middle" fill="#e6e6e6" font-size="11">function?</text>

  <!-- YES path -->
  <line x1="615" y1="116" x2="615" y2="160" stroke="#4a4" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="630" y="145" fill="#4a4" font-size="11">YES</text>

  <!-- NO path -->
  <line x1="540" y1="110" x2="440" y2="148" stroke="#ff3333" stroke-width="1.5" marker-end="url(#arrow3r)"/>
  <text x="470" y="140" fill="#ff3333" font-size="11">NO</text>

  <!-- NO: original PCL path -->
  <rect x="310" y="148" width="260" height="44" rx="6" fill="#1a1a1a" stroke="#ff3333" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="440" y="168" text-anchor="middle" fill="#ff3333" font-size="12">original update-dfun</text>
  <text x="440" y="184" text-anchor="middle" fill="#888" font-size="11">(rebuild discrimination net)</text>

  <!-- YES: fast path -->
  <!-- Step 1: clear caches -->
  <rect x="500" y="160" width="230" height="36" rx="6" fill="#1a1a1a" stroke="#4a4" stroke-width="1.5"/>
  <text x="615" y="183" text-anchor="middle" fill="#4a4" font-size="12">clrhash both caches</text>

  <line x1="615" y1="196" x2="615" y2="224" stroke="#4a4" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Step 2: reinstall discriminator -->
  <rect x="460" y="224" width="310" height="36" rx="6" fill="#1a1a1a" stroke="#4a4" stroke-width="1.5"/>
  <text x="615" y="247" text-anchor="middle" fill="#4a4" font-size="12">reinstall hash-table discriminator</text>

  <line x1="615" y1="260" x2="615" y2="288" stroke="#4a4" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Done -->
  <rect x="530" y="288" width="170" height="36" rx="6" fill="#1a2a1a" stroke="#4a4" stroke-width="2"/>
  <text x="615" y="311" text-anchor="middle" fill="#4a4" font-size="13">done (fast)</text>

  <!-- Comparison annotations -->
  <text x="40" y="240" fill="#888" font-size="11">PCL path: O(n) rebuild</text>
  <text x="40" y="258" fill="#888" font-size="11">per method count</text>
  <text x="40" y="290" fill="#4a4" font-size="11">Our path: O(1) clear</text>
  <text x="40" y="308" fill="#4a4" font-size="11">+ lazy re-cache</text>

  <text x="40" y="344" fill="#666" font-size="11">Caches lazily repopulate on next call to each class</text>
</svg>
