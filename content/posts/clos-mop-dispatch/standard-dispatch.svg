<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
    <marker id="arrow1g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a4"/>
    </marker>
    <marker id="arrow1r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff3333"/>
    </marker>
  </defs>

  <rect width="720" height="560" rx="8" fill="#111"/>

  <text x="360" y="36" text-anchor="middle" fill="#e6e6e6" font-size="16" font-weight="bold">Standard CLOS Dispatch (PCL)</text>

  <!-- Call site -->
  <rect x="250" y="56" width="220" height="44" rx="6" fill="#1a1a1a" stroke="#ff3333" stroke-width="2"/>
  <text x="360" y="83" text-anchor="middle" fill="#ff3333" font-size="13">(my-method obj args...)</text>

  <line x1="360" y1="100" x2="360" y2="130" stroke="#999" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Discriminating function / dfun -->
  <rect x="160" y="130" width="400" height="52" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
  <text x="360" y="152" text-anchor="middle" fill="#e6e6e6" font-size="13">discriminating function (dfun)</text>
  <text x="360" y="172" text-anchor="middle" fill="#888" font-size="11">caches dispatch by argument types</text>

  <!-- Fork: hit vs miss -->
  <line x1="260" y1="182" x2="160" y2="222" stroke="#4a4" stroke-width="2" marker-end="url(#arrow1g)"/>
  <line x1="460" y1="182" x2="560" y2="222" stroke="#999" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Cache HIT -->
  <rect x="40" y="222" width="240" height="44" rx="6" fill="#1a2a1a" stroke="#4a4" stroke-width="2"/>
  <text x="160" y="249" text-anchor="middle" fill="#4a4" font-size="13">dfun HIT: call cached emf</text>
  <text x="50" y="288" fill="#4a4" font-size="11">fast path</text>
  <text x="50" y="304" fill="#888" font-size="11">(steady state)</text>

  <!-- Cache MISS -->
  <rect x="440" y="222" width="240" height="44" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
  <text x="560" y="249" text-anchor="middle" fill="#e6e6e6" font-size="13">dfun MISS</text>

  <line x1="560" y1="266" x2="560" y2="296" stroke="#999" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- compute-applicable-methods -->
  <rect x="370" y="296" width="380" height="36" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="560" y="319" text-anchor="middle" fill="#e6e6e6" font-size="11">compute-applicable-methods-using-classes</text>

  <!-- Annotation: walks ALL specializers -->
  <text x="370" y="350" fill="#888" font-size="10">walks ALL specializers x ALL methods</text>

  <line x1="560" y1="332" x2="560" y2="362" stroke="#999" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- sort + effective method -->
  <rect x="400" y="362" width="320" height="36" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="560" y="385" text-anchor="middle" fill="#e6e6e6" font-size="11">sort + compute-effective-method</text>

  <line x1="560" y1="398" x2="560" y2="422" stroke="#999" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- fold into dfun -->
  <rect x="420" y="422" width="280" height="36" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="560" y="445" text-anchor="middle" fill="#e6e6e6" font-size="11">fold result into dfun cache</text>

  <!-- THE PROBLEM: update-dfun -->
  <rect x="100" y="488" width="520" height="44" rx="6" fill="#1a1a1a" stroke="#ff3333" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="360" y="508" text-anchor="middle" fill="#ff3333" font-size="12">update-dfun: rebuild entire dfun from scratch</text>
  <text x="360" y="524" text-anchor="middle" fill="#888" font-size="11">triggered on EVERY new class or method definition</text>

  <!-- arrow from update-dfun back to dfun -->
  <path d="M 100 510 Q 40 510 40 350 Q 40 156 160 156" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow1r)"/>
  <text x="20" y="370" fill="#ff3333" font-size="10" transform="rotate(-90 20 370)">new class loaded: invalidate</text>

  <!-- Annotation: EXPENSIVE -->
  <text x="640" y="500" fill="#ff3333" font-size="12" font-weight="bold">O(n)</text>
  <text x="640" y="516" fill="#888" font-size="10">per method</text>
  <text x="640" y="530" fill="#888" font-size="10">count</text>

  <!-- Legend -->
  <text x="360" y="554" text-anchor="middle" fill="#666" font-size="11">During class loading, the dfun never stabilizes — each rebuild is wasted work</text>
</svg>
